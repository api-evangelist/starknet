apis:
- aid: starknet:json-rpc
  name: Starknet JSON-RPC Specification
  description: >-
    Versioned JSON-RPC specification implemented by Starknet full nodes (Pathfinder, Juno, Papyrus) and
    infrastructure providers. Defines read methods (starknet_* for blocks, transactions, classes, state,
    storage, events), trace methods, and write methods for invoking, deploying accounts, and declaring
    classes.
  humanURL: https://github.com/starkware-libs/starknet-specs
  baseURL: https://github.com/starkware-libs/starknet-specs
